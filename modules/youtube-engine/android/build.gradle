apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.youtubeengine'
version = '0.1.0'

android {
  namespace "expo.modules.youtubeengine"
  compileSdk 36
  defaultConfig {
    minSdk 24
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled = true
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  // The exact nanojson NewPipeExtractor already ships (runtime scope there, so it
  // is not on our compile classpath). Adding upstream nanojson instead would
  // put two copies of com.grack.nanojson on the APK classpath -> duplicate classes.
  implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
  implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

  testImplementation 'junit:junit:4.13.2'
}